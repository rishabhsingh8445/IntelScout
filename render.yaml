services:
  - type: web
    name: intelscout-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "uv sync"
    startCommand: "uv run uvicorn src.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: NVIDIA_API_KEY
        sync: false
